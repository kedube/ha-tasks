# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
    ignore:
      # Dependabot should not update Home Assistant as that should match the homeassistant key in hacs.json
      - dependency-name: "homeassistant"
      # These follow the Home Assistant version the tests run against:
      # pytest-homeassistant-custom-component pins homeassistant and pytest-cov
      # exactly, and home-assistant-frontend must match that release. Bump the
      # three together, by hand, when raising the tested Home Assistant version.
      - dependency-name: "pytest-homeassistant-custom-component"
      - dependency-name: "pytest-cov"
      - dependency-name: "home-assistant-frontend"

  - package-ecosystem: "npm"
    directory: "/custom_components/tasks/panel"
    schedule:
      interval: "monthly"
    groups:
      # One grouped PR per month; the rebuild-panel workflow regenerates
      # dist/main.js on it so the CI bundle drift check passes.
      panel-dependencies:
        patterns:
          - "*"